<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AMAR STR — Dashboard</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}.card{background:#fff;border:1px solid #e8ebf2;border-radius:18px;box-shadow:0 8px 30px rgba(15,23,42,.05)}.nav{position:sticky;bottom:0;background:#fff;border-top:1px solid #e8ebf2}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useEffect,useState}=React;
const API='';
let sb=null;
const money=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
async function api(path,opt={}){let token=localStorage.getItem('amar_token'); if(!token && sb){const s=await sb.auth.getSession(); token=s.data.session?.access_token||''; if(token)localStorage.setItem('amar_token',token);} const headers={'Content-Type':'application/json',...(opt.headers||{})}; if(token)headers.Authorization='Bearer '+token; const r=await fetch(API+path,{...opt,headers}); let d={}; try{d=await r.json()}catch{} if(!r.ok)throw new Error(d.error||'Permintaan gagal'); return d}
function Toast({msg}){return msg?<div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg text-sm">{msg}</div>:null}
function Auth({onLogin}){const [mode,setMode]=useState('login'),[form,setForm]=useState({name:'',username:'',password:''}),[err,setErr]=useState(''),[busy,setBusy]=useState(false);
 const submit=async e=>{e.preventDefault();setErr('');setBusy(true);try{const endpoint=mode==='login'?'/api/auth/login':'/api/auth/register';const d=await api(endpoint,{method:'POST',body:JSON.stringify(form)});localStorage.setItem('amar_token',d.token);onLogin(d)}catch(e){setErr(e.message)}finally{setBusy(false)}};
 const google=async()=>{setErr('');setBusy(true);const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin}});if(error)setErr(error.message);setBusy(false)};
 return <div className="min-h-screen flex items-center justify-center p-5"><div className="card w-full max-w-md p-6"><div className="text-2xl font-black">AMAR STR</div><div className="text-slate-500 mt-1 mb-6">{mode==='login'?'Masuk ke akun':'Buat akun baru'}</div><form onSubmit={submit} className="space-y-3">{mode==='register'&&<input required className="w-full border rounded-xl p-3" placeholder="Nama" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/>}<input required pattern="[A-Za-z0-9_]{3,24}" className="w-full border rounded-xl p-3" placeholder="Username" value={form.username} onChange={e=>setForm({...form,username:e.target.value})}/><input required minLength="6" type="password" className="w-full border rounded-xl p-3" placeholder="Password" value={form.password} onChange={e=>setForm({...form,password:e.target.value})}/>{err&&<div className="text-red-600 text-sm">{err}</div>}<button disabled={busy} className="w-full bg-slate-900 text-white rounded-xl p-3 font-bold">{busy?'Memproses…':mode==='login'?'Masuk':'Daftar'}</button></form><div className="flex items-center gap-3 my-5 text-xs text-slate-400"><span className="h-px bg-slate-200 flex-1"></span>ATAU<span className="h-px bg-slate-200 flex-1"></span></div><button disabled={busy} onClick={google} className="w-full border rounded-xl p-3 font-bold">🌐 Login dengan Google</button><button className="mt-4 text-sm text-blue-600" onClick={()=>{setErr('');setMode(mode==='login'?'register':'login')}}>{mode==='login'?'Belum punya akun? Daftar':'Sudah punya akun? Masuk'}</button><div className="text-xs text-slate-400 mt-4">Akun biasa memakai username, bukan email. Login Google memakai akun Google yang dipilih.</div></div></div>}
function App(){const [me,setMe]=useState(null),[settings,setSettings]=useState(null),[tab,setTab]=useState('home'),[toast,setToast]=useState(''),[loading,setLoading]=useState(true); const [stor,setStor]=useState([]),[adminRows,setAdminRows]=useState([]),[users,setUsers]=useState([]),[adminSettings,setAdminSettings]=useState({}),[audit,setAudit]=useState([]); const [txt,setTxt]=useState(''); const [search,setSearch]=useState(''); const [balance,setBalance]=useState({}); const [withdraw,setWithdraw]=useState({amount:'',danaNumber:'',danaName:''});
 const notify=m=>{setToast(m);setTimeout(()=>setToast(''),2500)};
 const refresh=async()=>{try{const [m,s]=await Promise.all([api('/api/me'),api('/api/settings/public')]);setMe(m);setSettings(s);const h=await api('/api/stor/mine');setStor(h.items);if(m.isAdmin){const [a,u,st,lg]=await Promise.all([api('/api/admin/search'),api('/api/admin/users'),api('/api/admin/settings'),api('/api/admin/audit')]);setAdminRows(a.items);setUsers(u.users);setAdminSettings(st);setAudit(lg.items)}}catch(e){localStorage.removeItem('amar_token');setMe(null)}finally{setLoading(false)}};
 useEffect(()=>{if(localStorage.getItem('amar_token'))refresh();else setLoading(false)},[]);
 if(loading)return <div className="min-h-screen grid place-items-center">Memuat…</div>; if(!me)return <Auth onLogin={d=>{setMe(d);refresh()}}/>;
 const submitStor=async()=>{try{const d=await api('/api/stor',{method:'POST',body:JSON.stringify({txt})});setTxt('');notify(`Berhasil: ${d.added.length}, duplikat: ${d.duplicate.length}`);refresh()}catch(e){notify(e.message)}};
 const logout=async()=>{try{await api('/api/auth/logout',{method:'POST'})}catch{}localStorage.removeItem('amar_token');setMe(null)};
 const searchAdmin=async()=>{try{setAdminRows((await api('/api/admin/search?q='+encodeURIComponent(search))).items)}catch(e){notify(e.message)}};
 const setStatus=async(id,status)=>{try{await api('/api/admin/stor/'+id+'/status',{method:'POST',body:JSON.stringify({status})});notify('Status diperbarui');refresh()}catch(e){notify(e.message)}};
 const adjust=async id=>{const amount=Number(balance[id]);if(!amount)return;try{await api('/api/admin/users/'+id+'/balance',{method:'POST',body:JSON.stringify({amount})});setBalance({...balance,[id]:''});notify('Saldo diperbarui');refresh()}catch(e){notify(e.message)}};
 const saveSettings=async()=>{try{await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(adminSettings)});notify('Pengaturan disimpan');refresh()}catch(e){notify(e.message)}};
 const doWithdraw=async()=>{try{await api('/api/withdraw',{method:'POST',body:JSON.stringify(withdraw)});setWithdraw({amount:'',danaNumber:'',danaName:''});notify('Penarikan dibuat');refresh()}catch(e){notify(e.message)}};
 const Page=()=>{if(tab==='stor')return <div><h2 className="text-xl font-black mb-4">STOR Email / TXT</h2><div className="card p-4"><div className="text-sm text-slate-600 mb-3">Masukkan alamat email/TXT saja. Jangan masukkan password, OTP, cookie, recovery code, atau kredensial lain.</div><textarea rows="8" className="w-full border rounded-xl p-3 mono" placeholder="email@example.com\nemail2@example.com" value={txt} onChange={e=>setTxt(e.target.value)}/><button onClick={submitStor} className="mt-3 w-full bg-slate-900 text-white rounded-xl p-3 font-bold">Kirim STOR</button></div><div className="card p-4 mt-4"><b>Riwayat</b>{stor.map(x=><div key={x.id} className="py-3 border-b last:border-0"><div className="font-semibold">{x.email}</div><div className="text-xs text-slate-500">{x.status} · {x.created_at}{x.generated_by_admin&&` · Admin: ${x.generated_by_admin}`}</div></div>)}</div></div>;
 if(tab==='withdraw')return <div><h2 className="text-xl font-black mb-4">Penarikan</h2><div className="card p-4 space-y-3"><input className="w-full border rounded-xl p-3" type="number" placeholder="Nominal" value={withdraw.amount} onChange={e=>setWithdraw({...withdraw,amount:e.target.value})}/><input className="w-full border rounded-xl p-3" placeholder="Nomor DANA" value={withdraw.danaNumber} onChange={e=>setWithdraw({...withdraw,danaNumber:e.target.value})}/><input className="w-full border rounded-xl p-3" placeholder="Nama DANA" value={withdraw.danaName} onChange={e=>setWithdraw({...withdraw,danaName:e.target.value})}/><button onClick={doWithdraw} className="w-full bg-slate-900 text-white rounded-xl p-3 font-bold">Ajukan</button><div className="text-sm text-slate-500">Minimum: {money(settings?.min_withdrawal)}</div></div></div>;
 if(tab==='admin')return <Admin/>;
 return <div><div className="flex items-center justify-between mb-5"><div><div className="text-slate-500 text-sm">Halo,</div><h2 className="text-2xl font-black">{me.user.name}</h2></div><button onClick={logout} className="text-sm border rounded-xl px-3 py-2">Keluar</button></div><div className="card p-5 bg-slate-900 text-white"><div className="text-sm opacity-70">Saldo</div><div className="text-3xl font-black mt-1">{money(me.user.balance)}</div></div><div className="grid grid-cols-2 gap-3 mt-4"><button onClick={()=>setTab('stor')} className="card p-4 text-left"><b>STOR</b><div className="text-sm text-slate-500 mt-1">Email / TXT</div></button><button onClick={()=>setTab('withdraw')} className="card p-4 text-left"><b>Tarik Saldo</b><div className="text-sm text-slate-500 mt-1">Min {money(settings?.min_withdrawal)}</div></button></div><div className="card p-4 mt-4"><b>Aturan</b><pre className="whitespace-pre-wrap text-sm text-slate-600 mt-2">{settings?.rules}</pre></div></div>};
 function Admin(){return <div><div className="flex justify-between items-center mb-4"><h2 className="text-xl font-black">Admin Panel</h2><button onClick={logout} className="border rounded-xl px-3 py-2 text-sm">Keluar</button></div><div className="card p-4 mb-4"><b>Cari Gmail / User</b><div className="flex gap-2 mt-3"><input className="flex-1 border rounded-xl p-3" value={search} onChange={e=>setSearch(e.target.value)} placeholder="email atau nama"/><button onClick={searchAdmin} className="bg-slate-900 text-white rounded-xl px-4">Cari</button></div>{adminRows.map(x=><div key={x.id} className="py-3 border-b"><div className="font-semibold">{x.email}</div><div className="text-xs text-slate-500">Pemilik: {x.owner_email} · {x.status} · Admin: {x.generated_by_admin||'-'}</div><div className="flex gap-2 mt-2"><button onClick={()=>setStatus(x.id,'ACCEPTED')} className="text-xs border rounded-lg px-2 py-1">Terima</button><button onClick={()=>setStatus(x.id,'REJECTED')} className="text-xs border rounded-lg px-2 py-1">Tolak</button></div></div>)}</div><div className="card p-4 mb-4"><b>Tambah/Kurangi Saldo User</b>{users.map(u=><div key={u.id} className="py-3 border-b"><div className="font-semibold">{u.name} <span className="text-slate-400">{u.email}</span></div><div className="text-sm">Saldo: {money(u.balance)}</div><div className="flex gap-2 mt-2"><input className="flex-1 border rounded-lg p-2" type="number" placeholder="+ / - nominal" value={balance[u.id]||''} onChange={e=>setBalance({...balance,[u.id]:e.target.value})}/><button onClick={()=>adjust(u.id)} className="bg-slate-900 text-white rounded-lg px-3">Simpan</button></div></div>)}</div><div className="card p-4 mb-4"><b>Pengaturan</b><div className="grid gap-2 mt-3">{['store_status','price','min_withdrawal','txt_pool','tutorial_url','whatsapp_url','telegram_url'].map(k=><input key={k} className="border rounded-xl p-3" placeholder={k} value={adminSettings[k]||''} onChange={e=>setAdminSettings({...adminSettings,[k]:e.target.value})}/>)}<textarea className="border rounded-xl p-3" rows="5" placeholder="rules" value={adminSettings.rules||''} onChange={e=>setAdminSettings({...adminSettings,rules:e.target.value})}/><button onClick={saveSettings} className="bg-slate-900 text-white rounded-xl p-3 font-bold">Simpan Pengaturan</button></div></div><div className="card p-4"><b>Audit</b>{audit.slice(0,30).map(a=><div key={a.id} className="text-xs py-2 border-b">{a.created_at} · {a.actor_email} · {a.action} · {a.target_email||''} · {a.details||''}</div>)}</div></div>}
 return <><main className="max-w-3xl mx-auto p-4 pb-24"><Page/></main><Toast msg={toast}/><nav className="nav fixed bottom-0 left-0 right-0 z-40"><div className="max-w-3xl mx-auto grid grid-cols-4"><button className="p-4 text-sm" onClick={()=>setTab('home')}>Home</button><button className="p-4 text-sm" onClick={()=>setTab('stor')}>STOR</button><button className="p-4 text-sm" onClick={()=>setTab('withdraw')}>Tarik</button>{me.isAdmin&&<button className="p-4 text-sm font-bold" onClick={()=>setTab('admin')}>Admin</button>}</div></nav></>}
(async()=>{try{const c=await fetch('/api/auth/config').then(r=>r.json());sb=supabase.createClient(c.supabase_url,c.supabase_anon_key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const sess=await sb.auth.getSession();if(sess.data.session?.access_token)localStorage.setItem('amar_token',sess.data.session.access_token);sb.auth.onAuthStateChange((event,session)=>{if(session?.access_token)localStorage.setItem('amar_token',session.access_token);if(event==='SIGNED_OUT')localStorage.removeItem('amar_token')});ReactDOM.createRoot(document.getElementById('root')).render(<App/>);}catch(e){document.getElementById('root').innerHTML='<div style="padding:30px;font-family:system-ui">Konfigurasi Supabase belum diisi.</div>';}})();
</script></body></html>
